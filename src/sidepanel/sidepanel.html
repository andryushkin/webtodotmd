<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>to .md</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sidepanel.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous">
</head>
<body>
  <div class="app">
    <main class="app-main">
      <div class="capture-row">
        <button id="btn-capture" class="btn btn-primary"></button>
        <button id="btn-highlighter" class="btn btn-secondary" title="Highlighter mode"></button>
      </div>

      <div class="header-actions">
        <div class="view-toggle">
          <button id="btn-preview" class="toggle active" aria-pressed="true" title="Preview"></button>
          <button id="btn-source" class="toggle" aria-pressed="false" title="Source"></button>
        </div>
        <button id="btn-undo" class="btn-icon" disabled title="Undo"></button>
        <button id="btn-redo" class="btn-icon" disabled title="Redo"></button>
        <button id="btn-settings" class="btn-icon" title="Settings"></button>
      </div>

      <div id="preview-rendered" class="preview preview-rendered" dir="auto" aria-label="Rendered preview"></div>
      <textarea id="preview-source" class="preview preview-source" dir="auto" data-i18n="markdownPlaceholder" data-i18n-attr="placeholder" placeholder="Markdown will appear here…" hidden></textarea>

      <div id="rating-row" class="rating-row hidden">
        <button class="star" data-value="1">★</button>
        <button class="star" data-value="2">★</button>
        <button class="star" data-value="3">★</button>
        <button class="star" data-value="4">★</button>
        <button class="star" data-value="5">★</button>
        <button id="btn-rating-hide" class="btn-rating-hide" data-i18n="ratingHide">Hide</button>
      </div>

      <div id="status" class="status" aria-live="polite"></div>

      <div class="toolbar">
        <button id="btn-copy" class="btn btn-secondary" disabled></button>
        <button id="btn-download" class="btn btn-secondary" disabled></button>
        <div class="txt-menu-wrap">
          <button id="btn-txt-menu" class="btn btn-secondary" aria-haspopup="true" aria-expanded="false" disabled></button>
          <div id="txt-menu" class="txt-menu" hidden role="menu">
            <button id="btn-copy-txt" class="txt-menu-item" role="menuitem"></button>
            <button id="btn-download-txt" class="txt-menu-item" role="menuitem"></button>
          </div>
        </div>
        <button id="btn-clear" class="btn btn-ghost" disabled></button>
      </div>
    </main>
  </div>

  <script type="module" src="sidepanel.ts"></script>
</body>
</html>
