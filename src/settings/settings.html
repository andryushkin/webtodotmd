<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>to .md — Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="settings">
    <h1 data-i18n="settingsH1">to .md Settings</h1>

    <section class="group">
      <h2 data-i18n="sectionCapture">Capture</h2>

      <label class="setting">
        <span data-i18n="labelAutoMetadata">Auto-add metadata on capture</span>
        <input type="checkbox" class="switch" id="auto-metadata">
      </label>

      <label class="setting">
        <span data-i18n="labelShowBubble">Show floating bubble on selection</span>
        <input type="checkbox" class="switch" id="show-bubble">
      </label>

      <label class="setting">
        <span data-i18n="labelHtmlTables">Keep complex tables as HTML</span>
        <input type="checkbox" class="switch" id="html-tables">
      </label>
    </section>

    <section class="group">
      <h2 data-i18n="sectionDisplay">Display</h2>

      <label class="setting">
        <span data-i18n="labelObsidianButton">Show the Obsidian button</span>
        <input type="checkbox" class="switch" id="obsidian-button">
      </label>

      <label class="setting">
        <span data-i18n="labelCopyHtml">Add a button to copy the captured HTML</span>
        <input type="checkbox" class="switch" id="copy-html">
      </label>

      <div class="setting">
        <label for="default-view" data-i18n="labelDefaultView">Default view mode</label>
        <select id="default-view">
          <option value="preview" data-i18n="optPreview">Preview</option>
          <option value="source" data-i18n="optSource">Source</option>
        </select>
      </div>
    </section>

    <section class="group">
      <h2 data-i18n="sectionHighlighter">Highlighter</h2>

      <div class="setting">
        <label for="highlighter-color" data-i18n="labelHighlightColor">Highlight color</label>
        <input type="color" id="highlighter-color" value="#2563eb">
      </div>
    </section>

    <section class="group">
      <h2 data-i18n="sectionLanguage">Language</h2>

      <div class="setting">
        <label for="ui-language" data-i18n="labelLanguage">Language</label>
        <select id="ui-language">
          <option value="auto" data-i18n="optAuto">Auto (browser language)</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="it">Italiano</option>
          <option value="nl">Nederlands</option>
          <option value="sv">Svenska</option>
          <option value="da">Dansk</option>
          <option value="no">Norsk</option>
          <option value="fi">Suomi</option>
          <option value="ar">العربية</option>
          <option value="he">עברית</option>
          <option value="fa">فارسی</option>
          <option value="id">Bahasa Indonesia</option>
          <option value="ru">Русский</option>
          <option value="pt_PT">Português (PT)</option>
          <option value="ja">日本語</option>
          <option value="fil">Filipino</option>
          <option value="vi">Tiếng Việt</option>
          <option value="tr">Türkçe</option>
          <option value="th">ภาษาไทย</option>
          <option value="ko">한국어</option>
        </select>
      </div>
    </section>

    <section class="group">
      <h2 data-i18n="sectionRating">Rate this extension</h2>
      <div class="rating-row">
        <button class="star" data-value="1">★</button>
        <button class="star" data-value="2">★</button>
        <button class="star" data-value="3">★</button>
        <button class="star" data-value="4">★</button>
        <button class="star" data-value="5">★</button>
      </div>
    </section>

    <div id="status" class="status"></div>
  </div>

  <script type="module" src="settings.ts"></script>
</body>
</html>
