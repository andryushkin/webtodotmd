<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Slide 5 icons</title>
    <style>
      /* The slide's own field, so a glyph is judged against the background it
         will actually sit on rather than against white. */
      body { background: #2f2f2f; color: #fff; font-family: -apple-system, system-ui, sans-serif;
             margin: 0; padding: 40px; }
      h1 { font-size: 20px; font-weight: 500; margin-bottom: 24px; }
      .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 18px; }
      figure { background: #3a3a3a; border: 1px solid #4a4a4a; border-radius: 20px;
                padding: 22px; margin: 0; }
      .glyph svg { width: 40px; height: 40px; display: block; }
      figcaption { margin-top: 16px; font-size: 13px; font-family: Menlo, monospace; color: #ddd; }
      figcaption span { display: block; margin-top: 5px; color: #9a9a9a; font-family: inherit; }
    </style>
  </head>
  <body>
    <h1>Slide 5 — the six glyphs, at final size, on the slide's field</h1>
    <div class="row">
      <figure>
        <div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a9d3f0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3l18 18"/>
            <path d="M10.6 5.2A9.7 9.7 0 0 1 12 5c5 0 10 4.5 10 7 0 .9-.9 2.3-2.4 3.6M6.3 7.4C3.4 9.2 2 11.2 2 12c0 2.5 5 7 10 7 1.4 0 2.7-.3 4-.8"/>
            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
          </svg></div>
        <figcaption>01-hidden-text.svg<span>1: hidden text in your note</span></figcaption>
      </figure>
      <figure>
        <div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#d9b8f5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h10M9 4v2c0 4.5-2.2 7.6-5 9"/>
            <path d="M6.5 11.5c1.6 2.6 3.8 4.3 6.5 5.2"/>
            <path d="M13 20l4.2-10 4.2 10M14.8 16.6h4.8"/>
          </svg></div>
        <figcaption>02-languages.svg<span>2: interface languages</span></figcaption>
      </figure>
      <figure>
        <div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a9d3f0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H18a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6.5A2.5 2.5 0 0 1 4 18.5z"/>
            <path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/>
            <path d="M8.5 7.5h7M8.5 11h4.5"/>
          </svg></div>
        <figcaption>03-cases.svg<span>3: conversion cases, published</span></figcaption>
      </figure>
      <figure>
        <div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#d9b8f5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l7.5 3v5.4c0 4.3-3 8.3-7.5 9.6-4.5-1.3-7.5-5.3-7.5-9.6V6z"/>
            <path d="M8.8 12.2l2.2 2.2 4.2-4.6"/>
          </svg></div>
        <figcaption>04-tests.svg<span>4: automated tests, every build</span></figcaption>
      </figure>
      <figure>
        <div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a9d3f0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v11M12 14l-3.5-3.5M12 14l3.5-3.5"/>
            <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
          </svg></div>
        <figcaption>05-export.svg<span>5: ways out: .md · .txt · Obsidian · EditMD</span></figcaption>
      </figure>
      <figure>
        <div class="glyph"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#d9b8f5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20V9M10 20V4M16 20v-7M22 20H2"/>
            <path d="M13.6 8.4L16 6l2.4 2.4"/>
          </svg></div>
        <figcaption>06-checks.svg<span>6: more checks passed than the nearest clipper</span></figcaption>
      </figure>
    </div>
  </body>
</html>
